  <circle cx="236" cy="128" r="5" fill="white" opacity="0.5"/>
  <line x1="204" y1="128" x2="231" y2="128" stroke="white" stroke-width="1.5" opacity="0.3" stroke-dasharray="3,3"/>

  <!-- Store body -->
  <rect x="52" y="118" width="152" height="108" rx="8" fill="white"/>

  <!-- Roof -->
  <path d="M46 120 L210 120 L192 76 L64 76 Z" fill="url(#roofGrad)"/>
  <g clip-path="url(#roofClip)" opacity="0.25">
    <line x1="76" y1="76" x2="60" y2="120" stroke="white" stroke-width="10"/>
    <line x1="100" y1="76" x2="84" y2="120" stroke="white" stroke-width="10"/>
