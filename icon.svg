    <line x1="148" y1="76" x2="132" y2="120" stroke="white" stroke-width="10"/>
    <line x1="172" y1="76" x2="156" y2="120" stroke="white" stroke-width="10"/>
    <line x1="196" y1="76" x2="180" y2="120" stroke="white" stroke-width="10"/>
  </g>
  <path d="M46 120 Q52 130 58 120 Q64 130 70 120 Q76 130 82 120 Q88 130 94 120 Q100 130 106 120 Q112 130 118 120 Q124 130 130 120 Q136 130 142 120 Q148 130 154 120 Q160 130 166 120 Q172 130 178 120 Q184 130 190 120 Q196 130 202 120 Q208 130 210 120"
        fill="none" stroke="#C8273E" stroke-width="2"/>

  <!-- Blue circle with </> -->
  <circle cx="128" cy="152" r="38" fill="#1E88E5"/>
  <text x="128" y="164" font-family="'Courier New', monospace" font-size="26" font-weight="800"
        fill="white" text-anchor="middle">&lt;/&gt;</text>

